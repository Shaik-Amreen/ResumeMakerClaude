<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ollama Resume — Job Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #0f172a; color: #e2e8f0; }
    textarea { width: 100%; min-height: 120px; font-family: inherit; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #f1f5f9; }
    button { margin-top: 12px; padding: 10px 20px; border-radius: 8px; border: none; background: #6366f1; color: white; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 13px; color: #94a3b8; }
    #response { margin-top: 16px; white-space: pre-wrap; font-size: 13px; max-height: 40vh; overflow: auto; padding: 12px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
    #latex-output { display: none; }
  </style>
</head>
<body>
  <h1>Ollama Resume Generator</h1>
  <p id="model-label">Model: …</p>
  <textarea id="prompt" placeholder="Job description + profile prompt…"></textarea>
  <button id="send-btn" type="button">Send to Ollama</button>
  <div id="status" data-status="idle">Ready</div>
  <div id="response"></div>
  <pre id="latex-output"></pre>

  <script>
    const params = new URLSearchParams(location.search);
    const model = params.get('model') || 'minimax-m3:cloud';

    document.getElementById('model-label').textContent = 'Model: ' + model;

    function extractLatex(text) {
      const fence = text.match(/```(?:latex|tex)?\s*([\s\S]*?)```/i);
      if (fence) return fence[1].trim();
      if (/\\documentclass/i.test(text)) return text.trim();
      return text.trim();
    }

    document.getElementById('send-btn').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value.trim();
      const statusEl = document.getElementById('status');
      const responseEl = document.getElementById('response');
      const latexEl = document.getElementById('latex-output');
      const btn = document.getElementById('send-btn');

      if (!prompt) return;

      btn.disabled = true;
      statusEl.dataset.status = 'generating';
      statusEl.textContent = 'Generating…';
      responseEl.textContent = '';
      latexEl.textContent = '';

      try {
        const res = await fetch('/api/ollama/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model,
            messages: [{ role: 'user', content: prompt }],
            stream: true,
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Ollama request failed');
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let full = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          for (const line of chunk.split('\n')) {
            if (!line.trim()) continue;
            try {
              const json = JSON.parse(line);
              if (json.message?.content) {
                full += json.message.content;
                responseEl.textContent = full;
              }
              if (json.done) break;
            } catch {
              // partial line
            }
          }
        }

        const latex = extractLatex(full);
        latexEl.textContent = latex;
        statusEl.dataset.status = 'complete';
        statusEl.textContent = 'Complete — ' + latex.length + ' chars LaTeX';
      } catch (err) {
        statusEl.dataset.status = 'error';
        statusEl.textContent = 'Error: ' + (err.message || err);
        responseEl.textContent = String(err);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
